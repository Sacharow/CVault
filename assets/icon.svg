<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 800" width="100%" height="100%">
  <defs>
    <!-- Monochrome Metallic Gradients -->
    <radialGradient id="door-gradient" cx="50%" cy="50%" r="70%" fx="30%" fy="30%">
      <stop offset="0%" stop-color="#374151" />
      <stop offset="40%" stop-color="#1f2937" />
      <stop offset="85%" stop-color="#111827" />
      <stop offset="100%" stop-color="#030712" />
    </radialGradient>
    
    <linearGradient id="rim-gradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#6b7280" />
      <stop offset="30%" stop-color="#4b5563" />
      <stop offset="70%" stop-color="#1f2937" />
      <stop offset="100%" stop-color="#030712" />
    </linearGradient>

    <linearGradient id="spoke-grad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#9ca3af" />
      <stop offset="50%" stop-color="#4b5563" />
      <stop offset="100%" stop-color="#1f2937" />
    </linearGradient>

    <!-- Drop Shadows and Filters -->
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="15" stdDeviation="15" flood-color="#000000" flood-opacity="0.8" />
    </filter>
  </defs>

  <style>
    .bolt { fill: url(#rim-gradient); stroke: #030712; stroke-width: 2; }
    .rivet { fill: #4b5563; stroke: #030712; stroke-width: 1.5; }
  </style>

  <!-- Background / Frame Outer -->
  <rect x="50" y="50" width="700" height="700" rx="40" fill="#030712" filter="url(#shadow)" />
  <rect x="65" y="65" width="670" height="670" rx="30" fill="url(#rim-gradient)" stroke="#1f2937" stroke-width="4" />

  <!-- Heavy Vault Door Rim / Bolts ring -->
  <circle cx="400" cy="400" r="310" fill="#0b0f19" stroke="#030712" stroke-width="6" />
  <circle cx="400" cy="400" r="290" fill="url(#door-gradient)" stroke="#374151" stroke-width="3" />

  <!-- Door Bolts around the rim -->
  <g class="bolt">
    <circle cx="400" cy="115" r="14" /><circle cx="542" cy="153" r="14" /><circle cx="647" cy="258" r="14" /><circle cx="685" cy="400" r="14" />
    <circle cx="647" cy="542" r="14" /><circle cx="542" cy="647" r="14" /><circle cx="400" cy="685" r="14" /><circle cx="258" cy="647" r="14" />
    <circle cx="153" cy="542" r="14" /><circle cx="115" cy="400" r="14" /><circle cx="153" cy="258" r="14" /><circle cx="258" cy="153" r="14" />
  </g>

  <!-- Inner Vault Face Details (Circular Plates & Grooves) -->
  <circle cx="400" cy="400" r="240" fill="none" stroke="#1f2937" stroke-width="4" stroke-dasharray="12, 6" />
  <circle cx="400" cy="400" r="225" fill="#0a0f1d" stroke="#1f2937" stroke-width="2" />
  
  <!-- Corner Rivets -->
  <g class="rivet">
    <circle cx="100" cy="100" r="8" /><circle cx="700" cy="100" r="8" />
    <circle cx="100" cy="700" r="8" /><circle cx="700" cy="700" r="8" />
  </g>

  <!-- Central Mechanism / Hub -->
  <circle cx="400" cy="400" r="95" fill="url(#rim-gradient)" stroke="#030712" stroke-width="6" filter="url(#shadow)" />
  <circle cx="400" cy="400" r="80" fill="#0b0f19" />

  <!-- Center Star/Spokes Wheel -->
  <g>
    <!-- 4 Primary Spokes -->
    <rect x="388" y="240" width="24" height="160" rx="4" fill="url(#spoke-grad)" stroke="#030712" stroke-width="2" />
    <rect x="388" y="400" width="24" height="160" rx="4" fill="url(#spoke-grad)" stroke="#030712" stroke-width="2" />
    <rect x="240" y="388" width="160" height="24" rx="4" fill="url(#spoke-grad)" stroke="#030712" stroke-width="2" />
    <rect x="400" y="388" width="160" height="24" rx="4" fill="url(#spoke-grad)" stroke="#030712" stroke-width="2" />
    
    <!-- 4 Diagonal Spokes -->
    <g transform="rotate(45 400 400)">
      <rect x="390" y="260" width="20" height="140" rx="3" fill="url(#spoke-grad)" opacity="0.7" />
      <rect x="390" y="400" width="20" height="140" rx="3" fill="url(#spoke-grad)" opacity="0.7" />
      <rect x="260" y="390" width="140" height="20" rx="3" fill="url(#spoke-grad)" opacity="0.7" />
      <rect x="400" y="390" width="140" height="20" rx="3" fill="url(#spoke-grad)" opacity="0.7" />
    </g>
  </g>

  <!-- Center Hub Cap -->
  <circle cx="400" cy="400" r="45" fill="url(#rim-gradient)" stroke="#030712" stroke-width="3" />
  <circle cx="400" cy="400" r="32" fill="#030712" />

</svg>